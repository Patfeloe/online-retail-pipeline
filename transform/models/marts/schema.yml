version: 2

models:
  - name: dim_product
    columns:
      - name: product_id
        tests:
          - unique
          - not_null

  - name: dim_customer
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null

  - name: dim_date
    columns:
      - name: date_id
        tests:
          - unique
          - not_null

  - name: fact_sales
    columns:
      - name: invoice_no
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_product')
              field: product_id
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_customer')
              field: customer_id
      - name: date_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_id
      - name: quantity
        tests:
          - not_null
      - name: unit_price
        tests:
          - not_null

  - name: daily_revenue
    columns:
      - name: revenue
        tests:
          - not_null

  - name: top_products
    columns:
      - name: product_id
        tests:
          - unique
          - not_null